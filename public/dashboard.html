<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iga Neza | Dashboard</title>
    <link rel="stylesheet" href="./css/dashboard.css">
</head>
<body>
    <header class="top">
        <h1>Iga Neza</h1>
        <button id="logout-btn">Log out</button>
    </header>

    <section class="summary" id="summary"></section>

    <main class="layout">
        <section class="board">
            <h2>This week</h2>
            <div id="progress-list"></div>
        </section>

        <aside class="panel-box">
            <input type="radio" name="side" id="side-log" checked>
            <input type="radio" name="side" id="side-add">

            <div class="side-tabs">
                <label for="side-log">Log session</label>
                <label for="side-add">Add subject</label>
            </div>

            <section class="side-panel panel-log">
                <label for="ses-subject">Subject</label>
                <select id="ses-subject"></select>
                <label for="ses-minutes">Minutes</label>
                <input type="number" id="ses-minutes" min="1" max="600" step="1">
                <label for="ses-note">Note (optional)</label>
                <input type="text" id="ses-notes" maxlength="200">
                <button id="ses-btn">Log session</button>
            </section>

            <section class="side-panel panel-add">
                <label for="sub-name">Subject name</label>
                <input type="text" id="sub-name" maxlength="50">
                <label for="sub-hours">Weekly goal in hours</label>
                <input type="number" id="sub-hours" min="1" max="40" step="1">
                <button id="sub-btn">Add subject</button>
            </section>

            <p id="message" role="status"></p>
        </aside>
    </main>

    <script src="./js/dashboard.js"></script>
</body>
</html>
